<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crypto Price Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
  <div class="max-w-4xl mx-auto px-4 py-12">
    <h1 class="text-3xl font-bold text-center mb-2">Crypto Tracker</h1>
    <p class="text-center text-zinc-400 mb-10 text-sm">Live prices powered by CoinGecko API</p>

    <div id="loading" class="text-center text-zinc-400">Loading prices...</div>
    <div id="error" class="hidden text-center text-rose-400"></div>

    <div id="list" class="space-y-3"></div>
  </div>

  <script>
    async function loadPrices() {
      try {
        const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin,ethereum,solana,dogecoin,cardano,ripple&order=market_cap_desc');
        const data = await res.json();

        document.getElementById('loading').classList.add('hidden');
        const list = document.getElementById('list');
        list.innerHTML = '';

        data.forEach(coin => {
          const change = coin.price_change_percentage_24h;
          const changeColor = change >= 0 ? 'text-emerald-400' : 'text-rose-400';
          const changeSign = change >= 0 ? '+' : '';

          list.innerHTML += `
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 flex items-center gap-4 hover:border-zinc-600 transition">
              <img src="${coin.image}" alt="${coin.name}" class="w-10 h-10 rounded-full">
              <div class="flex-1">
                <p class="font-semibold">${coin.name}</p>
                <p class="text-xs text-zinc-500 uppercase">${coin.symbol}</p>
              </div>
              <div class="text-right">
                <p class="font-semibold">$${coin.current_price.toLocaleString()}</p>
                <p class="text-sm ${changeColor}">${changeSign}${change?.toFixed(2)}%</p>
              </div>
            </div>`;
        });
      } catch (err) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').innerText = 'Failed to load data. Please try again later.';
        document.getElementById('error').classList.remove('hidden');
      }
    }

    loadPrices();
    // Refresh every 60 seconds
    setInterval(loadPrices, 60000);
  </script>
</body>
</html>
